{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-activity-exporter.fullname" . }}
  labels:
    {{- include "github-activity-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key | quote }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
