{{- if .Values.dashboard.enabled }}
{{- $dashboard := .Files.Get "dashboards/github-activity.json" }}
{{- if not $dashboard }}
{{- fail "dashboards/github-activity.json is missing from the chart" }}
{{- end }}
{{- with .Values.dashboard.minStep }}
{{- $minStep := toString . }}
{{- $parsed := $dashboard | fromJson }}
{{- $found := false }}
{{- range $parsed.templating.list }}
{{- if eq .name "min_step" }}
{{- $_ := set . "query" $minStep }}
{{- $_ := set . "current" (dict "text" $minStep "value" $minStep) }}
{{- $_ := set . "options" (list (dict "selected" true "text" $minStep "value" $minStep)) }}
{{- $found = true }}
{{- end }}
{{- end }}
{{- if not $found }}
{{- fail "dashboards/github-activity.json has no min_step variable" }}
{{- end }}
{{- $dashboard = toJson $parsed }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-activity-exporter.fullname" . }}-dashboard
  labels:
    {{- include "github-activity-exporter.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  github-activity.json: {{ $dashboard | toJson }}
{{- end }}
