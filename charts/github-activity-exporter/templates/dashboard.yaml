{{- range $old, $new := dict "enabled" "dashboard.kpi.enabled" "labels" "dashboard.kpi.labels" "annotations" "dashboard.kpi.annotations" }}
{{- if hasKey $.Values.dashboard $old }}
{{- fail (printf "dashboard.%s was renamed to %s" $old $new) }}
{{- end }}
{{- end }}
{{- range $key, $d := dict "kpi" (dict "file" "github-activity.json" "suffix" "dashboard") "exporter" (dict "file" "github-activity-exporter.json" "suffix" "exporter-dashboard") }}
{{- $values := get $.Values.dashboard $key }}
{{- if $values.enabled }}
{{- $path := printf "dashboards/%s" $d.file }}
{{- $dashboard := $.Files.Get $path }}
{{- if not $dashboard }}
{{- fail (printf "%s is missing from the chart" $path) }}
{{- end }}
{{- with $.Values.dashboard.minStep }}
{{- $minStep := toString . }}
{{- if not (regexMatch "^[0-9]+(ms|[smhdwMy])$" $minStep) }}
{{- fail (printf "dashboard.minStep %q is not a Grafana interval such as 30m" $minStep) }}
{{- end }}
{{- $parsed := $dashboard | fromJson }}
{{- $found := false }}
{{- range $parsed.templating.list }}
{{- if eq .name "min_step" }}
{{- $_ := set . "query" $minStep }}
{{- $_ := set . "current" (dict "text" $minStep "value" $minStep) }}
{{- $_ := set . "options" (list (dict "selected" true "text" $minStep "value" $minStep)) }}
{{- $found = true }}
{{- end }}
{{- end }}
{{- if not $found }}
{{- fail (printf "%s has no min_step variable" $path) }}
{{- end }}
{{- $dashboard = toJson $parsed }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-activity-exporter.fullname" $ }}-{{ $d.suffix }}
  labels:
    {{- include "github-activity-exporter.labels" $ | nindent 4 }}
    {{- with $values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ $d.file }}: {{ $dashboard | toJson }}
{{- end }}
{{- end }}
