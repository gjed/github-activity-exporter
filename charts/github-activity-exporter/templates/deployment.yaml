{{- include "github-activity-exporter.validate" . }}
{{- $bridge := include "github-activity-exporter.bridgeEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-activity-exporter.fullname" . }}
  labels:
    {{- include "github-activity-exporter.labels" . | nindent 4 }}
spec:
  # Not configurable: two exporters for the same targets double every counter.
  replicas: 1
  # Recreate, so the old and new pod never run together during an upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "github-activity-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "github-activity-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            {{- if $bridge }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if or .Values.secret.env .Values.env }}
          env:
            {{- range $name, $key := .Values.secret.env }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "github-activity-exporter.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/github-activity-exporter/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.secret.files }}
            - name: secrets
              mountPath: /etc/github-activity-exporter/secrets
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "github-activity-exporter.fullname" . }}
        {{- if .Values.secret.files }}
        - name: secrets
          secret:
            secretName: {{ include "github-activity-exporter.secretName" . }}
            defaultMode: 288 # 0440: the container user (via fsGroup) only
            items:
              {{- range .Values.secret.files }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
