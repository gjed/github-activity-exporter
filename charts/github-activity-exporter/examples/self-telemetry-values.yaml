# One org with a PAT, plus self-telemetry metrics and traces. The Go runtime
# and GitHub API HTTP client metrics are pushed with the GitHub metrics to
# export.otlp every export.interval; one trace per collection cycle goes to
# the same endpoint (/v1/traces). Logs and profiles stay off.
#
#   kubectl create secret generic github-activity-exporter \
#     --from-literal=github-token="$GITHUB_TOKEN"
config:
  export:
    otlp:
      endpoint: https://otlp.example.com:4318
  telemetry:
    enabled: true
    metrics:
      enabled: true
    traces:
      enabled: true
    logs:
      enabled: false
    profiles:
      enabled: false
  targets:
    - name: my-org
      orgs:
        - org: my-org

secret:
  existingSecret: github-activity-exporter
  env:
    GITHUB_TOKEN: github-token

env:
  # go.memory.limit is reported only under a memory limit: about 90% of the
  # default container memory limit (resources.limits.memory, 256Mi).
  - name: GOMEMLIMIT
    value: 230MiB
  # One cycle in ten is traced; drop both to trace every cycle (the default,
  # parentbased_always_on). See the README, "Traces", for the span volume.
  - name: OTEL_TRACES_SAMPLER
    value: parentbased_traceidratio
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "0.1"
