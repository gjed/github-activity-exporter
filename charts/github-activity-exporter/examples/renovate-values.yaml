# Renovate PRs and the Dependency Dashboard of one org, with a PAT.
#
#   kubectl create secret generic github-activity-exporter \
#     --from-literal=github-token="$GITHUB_TOKEN" \
#     --from-literal=otlp-token='<token>'
#
# The Secret holds the raw OTLP token; OTLP_HEADERS adds the Bearer prefix with
# Kubernetes dependent env vars ($(OTLP_TOKEN)), which works because the chart
# puts secret.env vars before env.
config:
  export:
    otlp:
      endpoint: https://otlp.example.com:4318
      headers_env: OTLP_HEADERS
  targets:
    - name: renovate
      orgs:
        - org: my-org
      filters:
        prs:
          authors: ["renovate[bot]"]
      renovate_dashboard:
        enabled: true

secret:
  existingSecret: github-activity-exporter
  env:
    GITHUB_TOKEN: github-token
    OTLP_TOKEN: otlp-token

env:
  - name: OTLP_HEADERS
    value: authorization=Bearer $(OTLP_TOKEN)
