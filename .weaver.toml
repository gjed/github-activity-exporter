# Weaver live-check configuration (used by tests/integration).
# A resource carries no identifier, so a matcher pairs the exporter's
# resource with the attribute group that declares it.
[[live-check.matchers]]
id = "match.resource"
sample_type = "resource"
when = 'attributes["service.name"] == "github-activity-exporter"'
strict_attribute_groups = ["github_activity_exporter.resource"]
