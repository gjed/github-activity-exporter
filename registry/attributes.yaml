file_format: definition/2
attributes:
  - key: github.org
    type: string
    stability: development
    brief: GitHub organization or user account name.
    note: Used on all GitHub metrics to identify the org or user being monitored.
    examples: ["my-org", "acme-corp"]

  - key: github.repo
    type: string
    stability: development
    brief: GitHub repository name (without org prefix).
    examples: ["github-activity-exporter", "my-app"]

  - key: github.pr.state
    type:
      allow_custom_values: false
      members:
        - id: open
          value: "open"
          stability: development
          brief: Pull request is open.
        - id: closed
          value: "closed"
          stability: development
          brief: Pull request is closed (merged or unmerged).
        - id: draft
          value: "draft"
          stability: development
          brief: Pull request is a draft.
        - id: merged
          value: "merged"
          stability: development
          brief: Pull request was merged.
    stability: development
    brief: Current state of the pull request.
    examples: ["open", "closed", "draft", "merged"]

  - key: github.pr.label
    type: string
    stability: development
    brief: A label applied to the pull request.
    examples: ["renovate", "dependencies", "automerge"]

  - key: github.pr.review_status
    type:
      allow_custom_values: false
      members:
        - id: approved
          value: "approved"
          stability: development
          brief: PR has been approved by at least one reviewer.
        - id: changes_requested
          value: "changes_requested"
          stability: development
          brief: At least one reviewer has requested changes.
        - id: pending
          value: "pending"
          stability: development
          brief: Review has been requested but not yet completed.
        - id: none
          value: "none"
          stability: development
          brief: No review has been requested or submitted.
    stability: development
    brief: Aggregate review status of the pull request.
    examples: ["approved", "changes_requested", "pending", "none"]

  - key: github.issue.state
    type:
      allow_custom_values: false
      members:
        - id: open
          value: "open"
          stability: development
          brief: Issue is open.
        - id: closed
          value: "closed"
          stability: development
          brief: Issue is closed.
    stability: development
    brief: Current state of the GitHub issue.
    examples: ["open", "closed"]

  - key: github.issue.label
    type: string
    stability: development
    brief: A label applied to the GitHub issue.
    examples: ["bug", "enhancement", "renovate"]

  - key: renovate.dashboard.section
    type:
      allow_custom_values: true
      members:
        - id: awaiting_schedule
          value: "awaiting-schedule"
          stability: development
          brief: PRs awaiting their scheduled window.
        - id: rate_limited
          value: "rate-limited"
          stability: development
          brief: PRs currently rate-limited by Renovate.
        - id: pending_approval
          value: "pending-approval"
          stability: development
          brief: PRs waiting for manual approval.
        - id: pending
          value: "pending"
          stability: development
          brief: PRs pending creation or update.
    stability: development
    brief: Section within the Renovate dependency dashboard issue.
    examples: ["awaiting-schedule", "rate-limited", "pending-approval", "pending"]

  - key: exporter.target
    type: string
    stability: development
    brief: The configured scrape target identifier (e.g., org/repo slug).
    examples: ["my-org/github-activity-exporter", "acme-corp/platform"]

  - key: github.api.endpoint
    type:
      allow_custom_values: false
      members:
        - id: graphql
          value: "graphql"
          stability: development
          brief: GitHub GraphQL API (pull request query).
        - id: rest_issues
          value: "rest.issues"
          stability: development
          brief: GitHub REST issues list endpoint (issues and Renovate dashboard).
        - id: rest_repos
          value: "rest.repos"
          stability: development
          brief: GitHub REST organization repositories list endpoint (repo discovery).
    stability: development
    brief: GitHub API endpoint whose call failed.
    examples: ["graphql", "rest.issues", "rest.repos"]

  - key: github.api.rate_limit.resource
    type:
      allow_custom_values: false
      members:
        - id: core
          value: "core"
          stability: development
          brief: REST API endpoints outside the other pools.
        - id: search
          value: "search"
          stability: development
          brief: REST search endpoints, except code search.
        - id: code_search
          value: "code_search"
          stability: development
          brief: REST code search endpoint.
        - id: graphql
          value: "graphql"
          stability: development
          brief: GraphQL API.
        - id: integration_manifest
          value: "integration_manifest"
          stability: development
          brief: GitHub App manifest conversion endpoint.
        - id: source_import
          value: "source_import"
          stability: development
          brief: Source import endpoints.
        - id: actions_runner_registration
          value: "actions_runner_registration"
          stability: development
          brief: Self-hosted runner registration endpoints.
        - id: scim
          value: "scim"
          stability: development
          brief: SCIM endpoints.
        - id: dependency_snapshots
          value: "dependency_snapshots"
          stability: development
          brief: Dependency graph snapshot submission.
        - id: dependency_sbom
          value: "dependency_sbom"
          stability: development
          brief: Dependency graph SBOM export.
        - id: code_scanning_upload
          value: "code_scanning_upload"
          stability: development
          brief: Code scanning SARIF upload.
        - id: code_scanning_autofix
          value: "code_scanning_autofix"
          stability: development
          brief: Code scanning autofix endpoints.
        - id: other
          value: "other"
          stability: development
          brief: An X-RateLimit-Resource value not in the pools GitHub documents.
    stability: development
    brief: GitHub API rate limit pool, as named by the X-RateLimit-Resource response header.
    note: >
      Pools are listed in GitHub's GET /rate_limit documentation. A header value
      outside them is reported as `other`; a response without the header is
      attributed to the pool the request URL maps to (graphql, code_search,
      search or core).
    examples: ["core", "graphql", "search"]

attribute_groups:
  - id: github_activity_exporter.resource
    visibility: public
    stability: development
    brief: Resource attributes set by the exporter's MeterProvider.
    note: >
      Populated in internal/exporter/provider.go (buildResource) by the Go SDK
      resource detectors. Backends derive `job` and `instance` from them.
    attributes:
      - ref: service.name
        requirement_level: required
      - ref: host.name
        requirement_level: recommended
      - ref: os.type
        requirement_level: recommended
      - ref: os.description
        requirement_level: recommended
      - ref: process.pid
        requirement_level: recommended
      - ref: process.owner
        requirement_level: recommended
      - ref: process.command_args
        requirement_level: recommended
      - ref: process.executable.name
        requirement_level: recommended
      - ref: process.executable.path
        requirement_level: recommended
      - ref: process.runtime.name
        requirement_level: recommended
      - ref: process.runtime.version
        requirement_level: recommended
      - ref: process.runtime.description
        requirement_level: recommended
      - ref: container.id
        requirement_level:
          conditionally_required: If the exporter runs in a container.
