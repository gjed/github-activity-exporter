file_format: definition/2
metrics:
  # ── GitHub Pull Request Metrics ────────────────────────────────────────────

  - name: github.pr.count
    instrument: updowncounter
    annotations:
      prometheus:
        name: github.pr.count
        type: gauge
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Number of open pull requests grouped by state and label.
    note: >
      Counts open PRs only; the github.pr.state attribute is open or draft.
      Closed and merged volumes come from the github.pr.closed and
      github.pr.merged counters. Use the github.pr.label attribute for label
      breakdown.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required
      - ref: github.pr.state
        requirement_level: required
      - ref: github.pr.label
        requirement_level:
          conditionally_required: If the data point counts pull requests carrying a specific label.

  - name: github.pr.age
    instrument: gauge
    annotations:
      prometheus:
        name: github.pr.age
        type: gauge
    unit: s
    stability: development
    requirement_level: recommended
    brief: Age of an open pull request in seconds (time since creation).
    note: >
      Recorded as the oldest open PR per repo. The gauge is omitted for repos
      with no open PRs.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  - name: github.pr.close.duration
    instrument: histogram
    annotations:
      prometheus:
        name: github.pr.close.duration
        type: histogram
    unit: s
    stability: development
    requirement_level: recommended
    brief: Time from PR creation to close (merged or declined) in seconds.
    note: >
      Only recorded for PRs that transitioned to closed/merged since the
      previous collection cycle. Prevents double-counting across cycles.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  - name: github.pr.automerged
    instrument: counter
    annotations:
      prometheus:
        name: github.pr.automerged
        type: counter
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Total number of pull requests merged via automerge.
    note: >
      A PR is considered automerged if it was merged with no APPROVED review.
      Only counted for PRs merged since the previous collection cycle.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  - name: github.pr.created
    instrument: counter
    annotations:
      prometheus:
        name: github.pr.created
        type: counter
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Number of pull requests created.
    note: >
      Incremented once per selected PR created since the previous successful
      collection cycle of its repo.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  - name: github.pr.merged
    instrument: counter
    annotations:
      prometheus:
        name: github.pr.merged
        type: counter
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Number of pull requests merged.
    note: >
      Incremented once per selected PR merged since the previous successful
      collection cycle of its repo.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  - name: github.pr.closed
    instrument: counter
    annotations:
      prometheus:
        name: github.pr.closed
        type: counter
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Number of pull requests closed without being merged.
    note: >
      Incremented once per selected PR closed without merge since the previous
      successful collection cycle of its repo. Merged PRs are counted by
      github.pr.merged only.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  - name: github.pr.review_status
    instrument: gauge
    annotations:
      prometheus:
        name: github.pr.review_status
        type: gauge
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Number of open pull requests grouped by review status.
    note: >
      Uses the github.pr.review_status attribute to distinguish approved,
      changes_requested, pending, and none states.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required
      - ref: github.pr.review_status
        requirement_level: required

  # ── GitHub Issue Metrics ───────────────────────────────────────────────────

  - name: github.issue.count
    instrument: updowncounter
    annotations:
      prometheus:
        name: github.issue.count
        type: gauge
    unit: "{issue}"
    stability: development
    requirement_level: recommended
    brief: Number of GitHub issues grouped by state and label.
    note: >
      Use the github.issue.state attribute to distinguish open and closed issues.
      Use the github.issue.label attribute for label breakdown.
      Pull requests returned by the GitHub API are excluded.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required
      - ref: github.issue.state
        requirement_level:
          conditionally_required: If the data point counts issues by state.
      - ref: github.issue.label
        requirement_level:
          conditionally_required: If the data point counts issues carrying a specific label.

  - name: github.issue.age
    instrument: gauge
    annotations:
      prometheus:
        name: github.issue.age
        type: gauge
    unit: s
    stability: development
    requirement_level: recommended
    brief: Age of the oldest open GitHub issue in seconds (time since creation).
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  # ── Renovate Dashboard Metrics ─────────────────────────────────────────────

  - name: renovate.dashboard.queue
    instrument: gauge
    annotations:
      prometheus:
        name: renovate.dashboard.queue
        type: gauge
    unit: "{pr}"
    stability: development
    requirement_level: recommended
    brief: Number of pull requests in each section of the Renovate dependency dashboard.
    note: >
      The dashboard issue sections (awaiting-schedule, rate-limited, etc.)
      are parsed from the issue body and reported per section. Only
      checkboxes that reference a branch (`<!-- <type>-branch=<name> -->`)
      are counted; bulk-action checkboxes such as
      create-all-rate-limited-prs are not.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required
      - ref: renovate.dashboard.section
        requirement_level: required

  - name: renovate.dashboard.parse_error
    instrument: gauge
    annotations:
      prometheus:
        name: renovate.dashboard.parse_error
        type: gauge
    unit: "{error}"
    stability: development
    requirement_level: recommended
    brief: Set to 1 when the Renovate dependency dashboard cannot be parsed, 0 on success.
    note: >
      Emitted per repo. A value of 1 indicates the dashboard issue was found
      but its body carries none of the Renovate dashboard markers (the
      default header, the "no open or pending branches" notice, the Detected
      Dependencies heading, or a branch checkbox) — likely not a Renovate
      dashboard or a format change. A dashboard with nothing queued reports 0.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.org
        requirement_level: required
      - ref: github.repo
        requirement_level: required

  # ── Exporter Self-Metrics ──────────────────────────────────────────────────

  - name: github_exporter.scrape.duration
    instrument: histogram
    annotations:
      prometheus:
        name: github_exporter.scrape.duration
        type: histogram
    unit: s
    stability: development
    requirement_level: recommended
    brief: Duration of a complete collection cycle in seconds.
    note: Recorded once per collection cycle after all GitHub API calls complete.
    attributes:
      - ref: exporter.target
        requirement_level: required

  - name: github_exporter.scrape.overruns
    instrument: counter
    annotations:
      prometheus:
        name: github_exporter.scrape.overruns
        type: counter
    unit: "{cycle}"
    stability: development
    requirement_level: recommended
    brief: Number of collection cycles that ran longer than the collection interval.
    note: >
      Incremented once per cycle that ends after the next cycle was due. The
      next cycle then starts at once; cycles never overlap.
    attributes:
      - ref: exporter.target
        requirement_level: required

  - name: github_exporter.api.errors
    instrument: counter
    annotations:
      prometheus:
        name: github_exporter.api.errors
        type: counter
    unit: "{error}"
    stability: development
    requirement_level: recommended
    brief: Number of GitHub API errors encountered during collection.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.api.endpoint
        requirement_level: required

  - name: github_exporter.api.secondary_rate_limits
    instrument: counter
    annotations:
      prometheus:
        name: github_exporter.api.secondary_rate_limits
        type: counter
    unit: "{response}"
    stability: development
    requirement_level: recommended
    brief: Number of GitHub API responses treated as a secondary rate limit.
    note: >
      Incremented once per 403 or 429 response that carries Retry-After, or
      that is a 429 or names a secondary rate limit in its body, with
      X-RateLimit-Remaining not 0. Each one pauses every request of the target
      and is retried; retries are counted too. Exported with value 0 for every
      target from the first push.
    attributes:
      - ref: exporter.target
        requirement_level: required

  - name: github_exporter.api.rate_limit.remaining
    instrument: gauge
    annotations:
      prometheus:
        name: github_exporter.api.rate_limit.remaining
        type: gauge
    unit: "{request}"
    stability: development
    requirement_level: recommended
    brief: Number of GitHub API requests remaining in the current rate limit window.
    note: >
      Recorded from the rate limit headers of each GitHub API response for the
      target, one series per rate limit pool. No value is recorded for a pool
      before the target's first API response counted against it.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.api.rate_limit.resource
        requirement_level: required

  - name: github_exporter.api.rate_limit.reset
    instrument: gauge
    annotations:
      prometheus:
        name: github_exporter.api.rate_limit.reset
        type: gauge
    unit: s
    stability: development
    requirement_level: recommended
    brief: Unix time, in seconds, at which the current GitHub API rate limit window resets.
    note: >
      Recorded from the rate limit headers of each GitHub API response for the
      target, one series per rate limit pool. No value is recorded for a pool
      before the target's first API response counted against it.
    attributes:
      - ref: exporter.target
        requirement_level: required
      - ref: github.api.rate_limit.resource
        requirement_level: required

  - name: github_exporter.otlp.errors
    instrument: counter
    annotations:
      prometheus:
        name: github_exporter.otlp.errors
        type: counter
    unit: "{error}"
    stability: development
    requirement_level: recommended
    brief: Number of OTLP push failures.
    attributes:
      - ref: exporter.target
        requirement_level: required
