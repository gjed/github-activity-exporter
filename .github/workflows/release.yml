name: Release

on:
  push:
    branches:
      - main

# GITHUB_TOKEN only checks out and pushes images. Tags, the release commit
# and the GitHub release are written with the gjed-release app token below.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the gjed-release app credentials and only accepts runs from
    # protected branches, so a workflow on any other branch cannot mint the token.
    environment: release
    steps:
      # gjed-oss-main requires signed commits on main. The CHANGELOG commit made
      # by @semantic-release/git is unsigned, so it is pushed with the
      # gjed-release app, which bypasses the ruleset. The built-in GitHub
      # Actions app cannot be a bypass actor on a personal account.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the release commit and tag, create the GitHub release
          permission-issues: write # comment on issues fixed by the release
          permission-pull-requests: write # comment on pull requests included in the release

      - uses: actions/checkout@v4
        with:
          # semantic-release requires full git history to determine the next version
          fetch-depth: 0
          # Otherwise git pushes with the persisted GITHUB_TOKEN header instead of
          # the app token semantic-release puts in the remote URL.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.9.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install semantic-release dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        env:
          # Also used by goreleaser (via @semantic-release/exec) to publish the release.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm exec semantic-release
