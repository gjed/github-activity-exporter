name: Registry Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  registry-validate:
    name: Registry Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Weaver
        uses: ./.github/actions/setup-weaver
        with:
          # renovate: datasource=github-releases depName=open-telemetry/weaver
          weaver-version: "0.28.0"

      - name: Check registry schema
        run: weaver registry check -r registry/

      - name: Package registry (resolved dump for inspection)
        # `weaver registry resolve` is deprecated; `package` writes
        # manifest.yaml + resolved.yaml.
        run: |
          weaver registry package --v2 \
            -r registry/ \
            -o /tmp/registry-package \
            --resolved-registry-uri "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload resolved registry
        uses: actions/upload-artifact@v7
        with:
          name: resolved-registry
          path: /tmp/registry-package/

      - name: Smoke-test registry emit
        run: |
          weaver registry emit \
            -r registry/ \
            --stdout
