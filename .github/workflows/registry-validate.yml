name: Registry Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      registry: ${{ steps.filter.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect registry changes
        id: filter
        # The job below reads only the registry, its policies and the Weaver
        # setup. A PR touching none of them skips it; a skipped job reports
        # success. Pushes to main always run it.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Also fails the step under bash -e if HEAD^1 is missing; the piped
          # git diff below would otherwise fail open and skip the job.
          git diff --name-only --no-renames HEAD^1 HEAD
          if git diff --name-only --no-renames HEAD^1 HEAD |
            grep -qxE 'registry/.*|policies/.*|\.github/actions/setup-weaver/.*|\.github/workflows/registry-validate\.yml'; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "No registry changes, skipping registry validation."
            echo "registry=false" >> "$GITHUB_OUTPUT"
          fi

  registry-validate:
    name: Registry Validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Weaver
        uses: ./.github/actions/setup-weaver
        with:
          # renovate: datasource=github-releases depName=open-telemetry/weaver
          weaver-version: "0.28.0"

      - name: Check registry schema
        # policies/registry/ enforces the annotations.prometheus naming contract.
        run: weaver registry check --v2 -r registry/ -p policies/registry/

      - name: Package registry (resolved dump for inspection)
        # `weaver registry resolve` is deprecated; `package` writes
        # manifest.yaml + resolved.yaml.
        run: |
          weaver registry package --v2 \
            -r registry/ \
            -o /tmp/registry-package \
            --resolved-registry-uri "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload resolved registry
        uses: actions/upload-artifact@v7
        with:
          name: resolved-registry
          path: /tmp/registry-package/

      - name: Smoke-test registry emit
        run: |
          weaver registry emit \
            -r registry/ \
            --stdout
