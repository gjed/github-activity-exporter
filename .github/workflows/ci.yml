name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        # Exits non-zero when the code calls a known-vulnerable symbol.
        run: govulncheck ./...

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  check-generated:
    name: Check Generated Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run make generate
        run: make generate

      - name: Fail if generated files are stale
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are stale. Run 'make generate' and commit the result."
            git diff
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        # renovate: datasource=github-releases depName=gotestyourself/gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        run: |
          gotestsum \
            --junitfile test-results.xml \
            -- \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Compute coverage percentage
        id: coverage
        run: |
          PCT=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          COVERAGE_PCT: ${{ steps.coverage.outputs.pct }}
        with:
          script: |
            const pct = process.env.COVERAGE_PCT || 'unknown';
            const body = `### Test Coverage\n\nTotal coverage: **${pct}**`;
            // Find existing comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('### Test Coverage')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    # Only run on PRs targeting main, not on every feature branch push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Weaver
        uses: ./.github/actions/setup-weaver
        with:
          # renovate: datasource=github-releases depName=open-telemetry/weaver
          weaver-version: "0.28.0"

      - name: Weaver live-check
        # Emits metrics through the exporter's OTLP pipeline into
        # `weaver registry live-check` and asserts schema conformance.
        run: go test -tags integration -count=1 -timeout 180s -v ./tests/integration/...

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    # Catches release toolchain breakage before it reaches main, e.g.
    # https://github.com/gjed/github-activity-exporter/issues/65
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release needs the version tags and the history since the last one
          fetch-depth: 0
          persist-credentials: false

      - name: Check for release toolchain changes
        id: changes
        # HEAD is the PR merge commit; its first parent is the base branch.
        run: |
          if git diff --name-only HEAD^1 HEAD |
            grep -qxE 'package\.json|pnpm-lock\.yaml|\.releaserc\.js|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release toolchain changes, skipping the semantic-release dry run."
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install semantic-release dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release dry run
        if: steps.changes.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          # generateNotes only runs when analyzeCommits finds a release, so add
          # a local feat commit. It is never pushed.
          git -c user.name=ci -c user.email=ci@localhost \
            commit --allow-empty --quiet -m "feat: semantic-release dry run"

          # semantic-release checks push access with `git push --dry-run` before
          # any plugin runs, and this GITHUB_TOKEN is read-only. Send pushes to a
          # local bare repo that has a main branch; fetches still go to GitHub.
          sink="$RUNNER_TEMP/push-sink.git"
          git init --bare --quiet "$sink"
          git push --quiet "$sink" HEAD:refs/heads/main
          git config "url.$sink.pushInsteadOf" "https://github.com/$GITHUB_REPOSITORY"

          # On a pull_request event semantic-release exits 0 without analyzing
          # anything, and with --no-ci it takes the PR merge ref as the branch,
          # which is not in `branches`. Run it as a push to main instead.
          GITHUB_EVENT_NAME=push GITHUB_REF=refs/heads/main \
            pnpm exec semantic-release --dry-run | tee "$RUNNER_TEMP/semantic-release.log"

          # The early exits above also return 0, so require generateNotes.
          grep -q 'Completed step "generateNotes" of plugin "@semantic-release/release-notes-generator"' \
            "$RUNNER_TEMP/semantic-release.log"
