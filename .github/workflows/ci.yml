name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.12.2

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  check-generated:
    name: Check Generated Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run make generate
        run: make generate

      - name: Fail if generated files are stale
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are stale. Run 'make generate' and commit the result."
            git diff
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        # renovate: datasource=github-releases depName=gotestyourself/gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        run: |
          gotestsum \
            --junitfile test-results.xml \
            -- \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Compute coverage percentage
        id: coverage
        run: |
          PCT=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          COVERAGE_PCT: ${{ steps.coverage.outputs.pct }}
        with:
          script: |
            const pct = process.env.COVERAGE_PCT || 'unknown';
            const body = `### Test Coverage\n\nTotal coverage: **${pct}**`;
            // Find existing comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('### Test Coverage')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    # Only run on PRs targeting main, not on every feature branch push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Weaver
        uses: ./.github/actions/setup-weaver
        with:
          # renovate: datasource=github-releases depName=open-telemetry/weaver
          weaver-version: "0.28.0"

      - name: Weaver live-check
        # Emits metrics through the exporter's OTLP pipeline into
        # `weaver registry live-check` and asserts schema conformance.
        run: go test -tags integration -count=1 -timeout 180s -v ./tests/integration/...
