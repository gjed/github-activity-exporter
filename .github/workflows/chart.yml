name: Chart

on:
  pull_request:
    paths:
      - charts/**
      # Embedded in the chart through a symlink.
      - dashboards/github-activity.json
      - .github/workflows/chart.yml

permissions:
  contents: read

env:
  CHART_DIR: charts/github-activity-exporter

jobs:
  check:
    name: Check chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install kubeconform
        # renovate: datasource=go depName=github.com/yannh/kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: Lint, render and validate
        run: |
          set -o pipefail
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "$CHART_DIR"/examples/*-values.yaml; do
            echo "::group::values: ${values:-defaults}"
            helm lint --strict "$CHART_DIR" ${values:+-f "$values"}
            helm template ci "$CHART_DIR" ${values:+-f "$values"} |
              kubeconform -strict -summary -schema-location default -schema-location "$crds"
            echo "::endgroup::"
          done

